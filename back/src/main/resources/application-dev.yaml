spring:
  datasource:
    url: jdbc:h2:./db_dev;MODE=MySQL;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

custom:
  cookie:
    secure: false
    same-site: Lax

# Redisson Sentinel 설정 (로컬 Docker Compose)
# natMapper: Sentinel이 클라이언트에게 알려주는 컨테이너 내부 호스트명/IP를
#            로컬 PC에서 접근 가능한 127.0.0.1 포트로 변환
spring.redis.redisson.config: |
  sentinelServersConfig:
    masterName: mymaster
    sentinelAddresses:
      - "redis://127.0.0.1:26379"
      - "redis://127.0.0.1:26380"
      - "redis://127.0.0.1:26381"
    masterConnectionPoolSize: 8
    masterConnectionMinimumIdleSize: 2
    slaveConnectionPoolSize: 8
    slaveConnectionMinimumIdleSize: 2
    readMode: SLAVE
    subscriptionMode: MASTER
    natMapper: !<org.redisson.config.HostPortNatMapper>
      hostsPortMap:
        "redis-master:6379": "127.0.0.1:6379"
        "redis-slave:6379": "127.0.0.1:6380"
        "redis-sentinel-1:26379": "127.0.0.1:26379"
        "redis-sentinel-2:26379": "127.0.0.1:26380"
        "redis-sentinel-3:26379": "127.0.0.1:26381"
    database: 0
  threads: 16
  nettyThreads: 32
  codec: !<org.redisson.codec.JsonJacksonCodec> {}