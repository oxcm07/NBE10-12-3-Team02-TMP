server:
  forward-headers-strategy: framework

spring:
  application:
    name: back
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false

# Redisson Sentinel 설정 (운영 환경)
spring.redis.redisson.config: |
  sentinelServersConfig:
    masterName: ${REDIS_SENTINEL_MASTER:mymaster}
    sentinelAddresses:
      - "redis://${REDIS_SENTINEL_1:127.0.0.1:26379}"
      - "redis://${REDIS_SENTINEL_2:127.0.0.1:26380}"
      - "redis://${REDIS_SENTINEL_3:127.0.0.1:26381}"
    masterConnectionPoolSize: 16
    masterConnectionMinimumIdleSize: 4
    slaveConnectionPoolSize: 16
    slaveConnectionMinimumIdleSize: 4
    readMode: SLAVE
    subscriptionMode: MASTER
    password: ${REDIS_PASSWORD:}
    database: 0
  threads: 32
  nettyThreads: 64
  codec: !<org.redisson.codec.JsonJacksonCodec> {}
  security:
    oauth2:
      front-callback-url: "https://nbe-10-12-2-team02-fv1h.vercel.app"
      front-login-url: "https://nbe-10-12-2-team02-fv1h.vercel.app/login"
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              - account_email
            client-name: Kakao
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

springdoc:
  default-produces-media-type: application/json;charset=UTF-8

custom:
  jwt:
    accessToken:
      secret: ${JWT_ACCESS_SECRET}
      expirationSeconds: 600
    refreshToken:
      secret: ${JWT_REFRESH_SECRET}
      expirationSeconds: 604800
    blacklist:
      grace-seconds: 60
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  redis:
    refresh-token:
      prefix: "auth:refresh:"
      index-prefix: "auth:refresh:index:"
  cookie:
    secure: true
    same-site: None

app:
  rate-limit:
    seat-status:
      capacity: 5
      refill-tokens: 5
      refill-seconds: 1
      expire-after-access-minutes: 10
      maximum-size: 10000